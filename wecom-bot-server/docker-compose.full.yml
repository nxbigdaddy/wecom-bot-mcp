version: '3.8'

services:
  # 后端服务
  backend:
    build: .
    container_name: wecom-bot-backend
    restart: unless-stopped
    environment:
      - WECOM_BOT_WEBHOOK_KEY=${WECOM_BOT_WEBHOOK_KEY}
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
    networks:
      - wecom-network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 前端服务
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: wecom-bot-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - wecom-network

networks:
  wecom-network:
    driver: bridge
